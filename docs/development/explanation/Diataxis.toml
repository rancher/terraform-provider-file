title = "Diátaxis Documentation Framework"
description = "Overview of the 4 documentation quadrants used in this repository."
quadrant = "Explanation"

[background]
context = "Technical documentation is often chaotic, mixing step-by-step instructions, references, and discussions. This causes cognitive overload for developers and parsing issues for sub-agents."

[[sections]]
heading = "What Is Diátaxis?"
content = "Diátaxis is a systematic framework for structuring technical documentation. It proposes that all documentation should be split into 4 distinct quadrants based on two axes: Learning vs. Task and Theoretical vs. Practical."

[[sections]]
heading = "The 4 Quadrants"
content = "The 4 quadrants are: Tutorials (Learning-Oriented / Practical), How-To Guides (Goal-Oriented / Practical), Reference (Information-Oriented / Theoretical), and Explanation (Understanding-Oriented / Theoretical)."

[[sections]]
heading = "Rules of Separation"
content = "To prevent drift and keep documents high-signal, a single file must belong to exactly one quadrant. A How-To Guide must not explain background concepts; a Tutorial must not contain exhaustive API specifications."

[[sections]]
heading = "Compiled JSON Context Injection"
content = "To ensure sub-agents receive perfectly formatted, deterministic, and highly structured guidelines, all repository developer-reference standards and guidelines are written in strict TOML format according to Diátaxis principles. During agent executions (like code reviews), these TOML documents are programmatically compiled into a single unified JSON index (docs/docs-compiled.json) and injected directly into the sub-agent contexts, replacing unstructured legacy reference Markdown files."
