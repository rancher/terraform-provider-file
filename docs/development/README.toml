title = "Developer Documentation Center"
description = "Index and structured reference for the terraform-provider-file developer documentation library."
quadrant = "Explanation"

[background]
context = "Detailed architectural background and explanations."

[[sections]]
heading = "Abstract"
content = '''
Welcome to the `terraform-provider-file` developer documentation center. Our library is structured around the **Diátaxis framework**, which separates documentation into four distinct conceptual archetypes: Tutorials, How-To Guides, Reference, and Explanation.

By organizing our documentation this way, we keep it highly accessible and contextual for developers and automated review agents.
'''

[[sections]]
heading = "🧭 Diátaxis Table of Contents"
content = '''
### 1. 🎓 Tutorials (Learning-Oriented)

Gentle, beginner-focused steps designed to help you set up your machine and complete your first local exercises:

- **[Getting Started](./tutorials/GettingStarted.toml):** Learn how to clone the repo, load the Nix shell, build the provider, and run basic unit tests.

### 2. 📋 How-To Guides (Goal-Oriented)

Practical, step-by-step procedural guides designed to accomplish specific development goals:

- **[Running Tests & Linters](./how-to/Testing.toml):** Procedural steps for formatting all code files, executing linters (`golangci-lint`, `shellcheck`, `cspell`), and running our acceptance testing suites.
- **[Executing Releases](./how-to/ReleaseProcess.toml):** Procedural checklist for configuring GPG keys, writing conventional commit PR titles, and publishing signed production assets.
- **[Resolving PR Reviews](./how-to/PRReviewResolution.toml):** Practical steps for analyzing and addressing pull request review comments.
- **[Workflow Troubleshooting](./how-to/WorkflowTroubleshooting.toml):** Sequential diagnostic procedures for investigating, retrieving logs from, and resolving CI/CD pipeline failures.

### 3. 🧠 Explanation (Understanding-Oriented)

High-level, concept-oriented narratives explaining the architecture and design rationale:

- **[Diátaxis Framework](./explanation/Diataxis.toml):** Architectural explanation of our four-quadrant documentation structure and compile-time verification.
- **[Automated Branch Merging](./explanation/AutoMerging.toml):** Architectural explanation of our event-driven verification script pipeline, Vault token retrievals, and squash-merging enforcers.
- **[GitHub Workflows & Automation](./explanation/GitHubWorkflows.toml):** Concept explanation of the standard execution models, security policies, and script orchestration patterns in GitHub Actions.
- **[Release Pipeline Lifecycle](./explanation/ReleasePipeline.toml):** Concept tracing of our automated versioning triggers, SemVer guards, and GoReleaser compiler workflows.

### 4. 📚 Reference Material (Information-Oriented)

Dry, clinical, and exhaustive technical indices of coding standards, linter rules, syntax constraints, and project history:

- **[Coding Standards Reference Index](./reference/CodingStandards.toml):** The primary index of all repository standards:
  - **[Go Standards](./reference/Go.toml):** Go linter configurations, error-wrapping, context propagation, and plugin caches.
  - **[Terraform Standards](./reference/Terraform.toml):** Resource naming conventions, schema validations, sensitive value redactions, and state handling.
  - **[JavaScript Standards](./reference/JavaScript.toml):** Unified ESM rules, empty catch block bans, pagination, and command injection safeguards.
  - **[Shell Scripts](./reference/ShellScripts.toml):** Bash fail-fast parameters, shebangs, double brackets, and Makefile actions.
  - **[Workflows](./reference/Workflows.toml):** GHA permissions, SHA action pinning, and allowlist namespaces.
  - **[Documentation Formatting](./reference/DocumentationFormatting.toml):** Layout structures, Diátaxis specifications, and spellcheck exclusions.
- **PR Automation & Merging Specifications:**
  - **[PR Executor](./reference/PRExecutor.toml):** Component specification for `.github/workflows/pr-executor.yml`.
  - **[Pull Request Triggers](./reference/PullRequestTriggers.toml):** Entry triggers and target PR context resolution.
  - **[Pull Request Verification](./reference/PullRequestVerification.toml):** Programmatic verification checks before auto-merging.
  - **[Squash Merge Executor](./reference/SquashMergeExecutor.toml):** Automated squash merging and SemVer boundary enforcement.
  - **[Vault Token Retrieval](./reference/VaultTokenRetrieval.toml):** OIDC-based secret management and GitHub merge token retrieval.
- **Release & Versioning Specifications:**
  - **[Main Branch Releases](./reference/MainBranchReleases.toml):** Trunk-based release strategy and tag creation rules.
  - **[Release Please](./reference/ReleasePlease.toml):** Automated changelog generation and SemVer release PR orchestration.
- **Documentation History:**
  - **[Changelog](./reference/CHANGELOG.toml):** Historical log of documentation refactors and architectural updates.
'''
