title = "Coding Standards & Guidelines"
description = "The main reference index of the repository's mandatory coding standards, security baselines, and quality criteria."
quadrant = "Reference"

[[items]]
name = "Core Development Languages"
type = "Index"
signature = "Go, Terraform"
description = "Standard rules for core development languages used in the repository."

  [[items.parameters]]
  name = "Go Standards"
  required = true
  type = "reference"
  description = "Dry, searchable reference index of Go syntax, context propagation, error wrapping, concurrency, and standalone test module configurations. Defined in Go.toml."

  [[items.parameters]]
  name = "Terraform Standards"
  required = true
  type = "reference"
  description = "Dry, searchable reference index of Terraform snake_case naming style, variable validations, check blocks, sensitive redaction, and module layouts. Defined in Terraform.toml."

[[items]]
name = "CI/CD & Automation Ecosystems"
type = "Index"
signature = "Workflows, JavaScript, ShellScripts"
description = "Standards for workflows, Node/JS, and Shell execution scripting."

  [[items.parameters]]
  name = "GitHub Actions Workflows"
  required = true
  type = "reference"
  description = "Dry, searchable reference index of GHA workflow default permissions, OIDC token federation, SHA-pinned actions, allowed namespaces, and script isolation. Defined in Workflows.toml."

  [[items.parameters]]
  name = "JavaScript & Node.js Rules"
  required = true
  type = "reference"
  description = "Dry, searchable reference index of JavaScript empty catch block bans, GHA module exports, fail-safe JSON parsers, and execFileSync shell-injection safeguards. Defined in JavaScript.toml."

