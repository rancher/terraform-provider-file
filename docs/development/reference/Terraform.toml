title = "Terraform Coding Standards"
description = "Strict reference index of Terraform variable validations, lifecycles, and state safety rules."
quadrant = "Reference"

[[items]]
name = "Syntax, Formatting & Linter Compliance"
type = "Standard"
signature = "terraform fmt, tflint"
description = "Rules regarding linter compliance, formatting, and lowercase snake_case naming."

  [[items.parameters]]
  name = "terraform fmt"
  required = true
  type = "constraint"
  description = "All .tf files must comply strictly with standard terraform fmt indentation, spacing, and block alignment rules."

  [[items.parameters]]
  name = "lowercase snake_case labels"
  required = true
  type = "constraint"
  description = "All block identifiers, resource names, data source names, variable names, module names, and output names MUST use lowercase letters, digits, and underscores only (snake_case). Never use uppercase letters or hyphens."

  [[items.parameters]]
  name = "tflint"
  required = true
  type = "constraint"
  description = "All directories must pass local tflint static analysis scans with zero warnings or violations."

[[items]]
name = "Declarative Logic & Lifecycle Management"
type = "Standard"
signature = "lifecycles"
description = "Stability via for_each, post-apply validations, variable validation, and depends_on scoped usage."

  [[items.parameters]]
  name = "for_each over count"
  required = true
  type = "constraint"
  description = "Prefer using for_each over count when creating multiple resources from lists or maps to avoid redundant resource destruction/creation cycles on item deletions."

  [[items.parameters]]
  name = "basic validations"
  required = true
  type = "constraint"
  description = "Use validation blocks on variables for input-level correctness (regex patterns, CIDR blocks, string options) at the earliest stage."

  [[items.parameters]]
  name = "complex post-apply validations"
  required = true
  type = "constraint"
  description = "Use check blocks for post-apply functional validations, especially assertions comparing inputs/outputs across multiple separate resources."

  [[items.parameters]]
  name = "complex execution preconditions"
  required = true
  type = "constraint"
  description = "Use terraform_data resource preconditions for complex structural assertions that cannot be evaluated in standard check blocks to halt apply before destruction."

  [[items.parameters]]
  name = "scoped depends_on"
  required = true
  type = "constraint"
  description = "Avoid depends_on unless implicit dependencies are structurally impossible. Document precisely why if used."

[[items]]
name = "Security, Hardening & State Safety"
type = "Standard"
signature = "security"
description = "Redaction of private values, credential management, and tfsec/trivy static security scanning."

  [[items.parameters]]
  name = "sensitive outputs"
  required = true
  type = "constraint"
  description = "Any variable or output containing credentials, TLS private keys, API keys, passwords, or personal data MUST be explicitly marked with sensitive = true."

  [[items.parameters]]
  name = "no hardcoded credentials"
  required = true
  type = "constraint"
  description = "Under no circumstances should secrets or tokens be hardcoded inside any .tf file. Manage secrets through secure variables, vault data sources, or environment."

  [[items.parameters]]
  name = "static security scans"
  required = true
  type = "constraint"
  description = "All configurations must pass static security scans (tfsec or trivy) to ensure compliance with infrastructure hardening baselines."

[[items]]
name = "Architecture, Modularization & Testing"
type = "Standard"
signature = "architecture"
description = "Strict type enforcement, standardized module file layout, and descriptive documentation comments."

  [[items.parameters]]
  name = "explicit types"
  required = true
  type = "constraint"
  description = "Never declare variables with type = any. Always declare explicit, tightly constrained schemas to catch configuration errors during planning."

  [[items.parameters]]
  name = "module layout"
  required = true
  type = "constraint"
  description = "Directories must separate block types into discrete standardized files: main.tf, variables.tf, outputs.tf, and versions.tf."

  [[items.parameters]]
  name = "descriptive comments"
  required = true
  type = "constraint"
  description = "Every variable and output declaration MUST contain a meaningful, grammatically correct description string explaining its purpose."
