title = "Documentation Formatting Schemas"
description = "Strict TOML schemas for the 4 Diátaxis quadrants."
quadrant = "Reference"

[[items]]
name = "Tutorial"
type = "Schema"
signature = "docs/**/*.toml (quadrant = \"Tutorial\")"
description = "Used for step-by-step hands-on lessons for beginners."

  [[items.parameters]]
  name = "title"
  required = true
  type = "string"
  description = "The main heading of the Tutorial."

  [[items.parameters]]
  name = "description"
  required = true
  type = "string"
  description = "A concise description of what the user will build or learn."

  [[items.parameters]]
  name = "quadrant"
  required = true
  type = "string"
  description = "Must be strictly \"Tutorial\"."

  [[items.parameters]]
  name = "prerequisites"
  required = true
  type = "table"
  description = "A table describing knowledge_level and tools_required."

  [[items.parameters]]
  name = "steps"
  required = true
  type = "array of tables"
  description = "List of steps, each containing title, action, and expected_result."

[[items]]
name = "How-To"
type = "Schema"
signature = "docs/**/*.toml (quadrant = \"How-To\")"
description = "Used for task-focused recipes for experienced users."

  [[items.parameters]]
  name = "title"
  required = true
  type = "string"
  description = "Goal-oriented title starting with 'How to'."

  [[items.parameters]]
  name = "description"
  required = true
  type = "string"
  description = "The context of what the task accomplishes."

  [[items.parameters]]
  name = "quadrant"
  required = true
  type = "string"
  description = "Must be strictly \"How-To\"."

  [[items.parameters]]
  name = "context"
  required = true
  type = "table"
  description = "A table describing goal and audience."

  [[items.parameters]]
  name = "instructions"
  required = true
  type = "array of tables"
  description = "List of instructions, each containing step, description, code_snippet, or command."

[[items]]
name = "Reference"
type = "Schema"
signature = "docs/**/*.toml (quadrant = \"Reference\")"
description = "Used for clinical, truth-oriented technical definitions."

  [[items.parameters]]
  name = "title"
  required = true
  type = "string"
  description = "Nouns representing the APIs, systems, or parameters documented."

  [[items.parameters]]
  name = "description"
  required = true
  type = "string"
  description = "Overview of the technical reference."

  [[items.parameters]]
  name = "quadrant"
  required = true
  type = "string"
  description = "Must be strictly \"Reference\"."

  [[items.parameters]]
  name = "items"
  required = true
  type = "array of tables"
  description = "List of reference objects, each containing name, type, signature, and parameters array."

[[items]]
name = "Explanation"
type = "Schema"
signature = "docs/**/*.toml (quadrant = \"Explanation\")"
description = "Used for discussion and conceptual background."

  [[items.parameters]]
  name = "title"
  required = true
  type = "string"
  description = "Conceptual title describing the architecture or design topic."

  [[items.parameters]]
  name = "description"
  required = true
  type = "string"
  description = "A short summary of the explanation's theme."

  [[items.parameters]]
  name = "quadrant"
  required = true
  type = "string"
  description = "Must be strictly \"Explanation\"."

  [[items.parameters]]
  name = "background"
  required = true
  type = "table"
  description = "A table containing high-level context."

  [[items.parameters]]
  name = "sections"
  required = true
  type = "array of tables"
  description = "List of discussion sections, each containing heading and content."

[[items]]
name = "Syntax, Formatting & Linter Compliance"
type = "Standard"
signature = "cspell, markdownlint"
description = "Formatting and quality rules for all repository documentation."

  [[items.parameters]]
  name = "cspell"
  required = true
  type = "Constraint"
  description = "All written documentation, code comments, and configuration descriptions must be free of typos and slang, with terms added strictly to custom_words.txt."

  [[items.parameters]]
  name = "nesting"
  required = true
  type = "Constraint"
  description = "Headers must follow sequential nesting (#, ##, ###) without skipping levels."

  [[items.parameters]]
  name = "capitalization"
  required = true
  type = "Constraint"
  description = "All headings must use title case or sentence case consistently. Comment blocks must begin with capitals and end with punctuation."

[[items]]
name = "Architectural Blueprints & Planning Documents"
type = "Standard"
signature = "blueprints"
description = "Standard structure rules for high-level technical layouts."

  [[items.parameters]]
  name = "topic layout"
  required = true
  type = "Constraint"
  description = "Overarching domain documents mapping major system areas must reside under docs/development/ and contain a ## Abstract section with sub-component links."

  [[items.parameters]]
  name = "declarative rules"
  required = true
  type = "Constraint"
  description = "Blueprints must strictly describe the system's actual, current state. Writing task checklists, TODO blocks, or historic changelogs inside blueprints is strictly banned."

