title = "Shell Script Coding Standards"
description = "Strict reference index of shell script (Bash and POSIX sh) syntax, safety, execution, and structure rules."
quadrant = "Reference"

[[items]]
name = "Safety & Execution"
type = "Standard"
signature = "shebang, set, safe expansion"
description = "Critical rules regarding interpreters, fail-fast parameters, and safe variable expansions."

  [[items.parameters]]
  name = "context-aware shebangs"
  required = true
  type = "constraint"
  description = "Always declare intended interpreter: #!/usr/bin/env bash or #!/bin/bash for Bash (Nix, CI, Local). Use #!/bin/sh for POSIX targets (Ubuntu/dash compatibility)."

  [[items.parameters]]
  name = "fail-fast parameters"
  required = true
  type = "constraint"
  description = "All scripts must terminate immediately on error: set -euo pipefail for Bash; set -eu for POSIX sh."

  [[items.parameters]]
  name = "safe variable expansion"
  required = true
  type = "constraint"
  description = "Always wrap and quote variable expansions to prevent word splitting and glob expansion. Good: rm -rf \"${DIR_PATH:?}\"/*"

[[items]]
name = "Syntax, Conditionals & Linters"
type = "Standard"
signature = "shellcheck, brackets, substitution"
description = "Linter compliance, safe brackets, and substitution rules."

  [[items.parameters]]
  name = "shellcheck compliance"
  required = true
  type = "constraint"
  description = "All shell scripts must pass shellcheck with zero findings. Use shellcheck -s sh for POSIX scripts."

  [[items.parameters]]
  name = "safe conditionals"
  required = true
  type = "constraint"
  description = "Bash: Prefer double brackets [[ ]] (prevents word splitting/path expansion). POSIX sh: Must use single brackets [ ] and aggressively quote inside them."

  [[items.parameters]]
  name = "command substitution"
  required = true
  type = "constraint"
  description = "Always use $(command) for command substitution. Backticks are strictly banned."

[[items]]
name = "Naming Conventions & Modularity"
type = "Standard"
signature = "naming, scoping, functions"
description = "Rules regarding variable naming styles, scoping inside functions, usage/help, and entry points."

  [[items.parameters]]
  name = "local variable scoping"
  required = true
  type = "constraint"
  description = "Always declare variables inside functions with the local keyword (except POSIX sh) to prevent global state leakage."

  [[items.parameters]]
  name = "variable naming style"
  required = true
  type = "constraint"
  description = "Use UPPER_CASE for global/configuration/env variables. Use lower_case or snake_case for internal, local, or helper variables."

  [[items.parameters]]
  name = "mandatory modularity"
  required = true
  type = "constraint"
  description = "Organize all script logic into cohesive, single-responsibility functions rather than monolithic script blocks."

  [[items.parameters]]
  name = "help and usage"
  required = true
  type = "constraint"
  description = "Implement standard usage and help parsing. Parse -h and --help, printing instruction manuals via a show_help() function and exiting status 0."

  [[items.parameters]]
  name = "main execution entry"
  required = true
  type = "constraint"
  description = "Every script must have a main() function at the bottom of the script orchestrating the flow, invoked explicitly as main \"$@\"."

[[items]]
name = "Test Scripts, Makefiles & Cleanup"
type = "Standard"
signature = "makefile, runner, traps"
description = "Requirements for Makefile targets, automated test runner features, exit traps, and cleanup operations."

  [[items.parameters]]
  name = "independent makefile actions"
  required = true
  type = "constraint"
  description = "Makefile must run outside dev environment context, warning if Nix is missing, and must define targets: lint, test, build, and cleanup (takes ID)."

  [[items.parameters]]
  name = "automated test runner"
  required = true
  type = "constraint"
  description = "run_tests.sh must support --lint-only, --build-only, --cleanup_id, slow-mode, and offline local cache seeding."

  [[items.parameters]]
  name = "guaranteed cleanup"
  required = true
  type = "constraint"
  description = "Cleanup sequence must execute within a bash trap (on EXIT, ERR, INT) inside run_tests.sh to ensure execution on crashes."

  [[items.parameters]]
  name = "standard tagged cleanup"
  required = true
  type = "constraint"
  description = "cleanup.sh runs standalone. If no run ID is provided, it must find and destroy resources tagged with \"Owner\" = \"terraform-ci@suse.com\"."
