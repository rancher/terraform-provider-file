title = "GitHub Actions Workflow Coding Standards"
description = "Strict reference index of GitHub Actions workflow security, reliability, and orchestration rules."
quadrant = "Reference"

[[items]]
name = "Security & Hardening"
type = "Standard"
signature = "permissions, OIDC, SHA pin, namespace, interpolation"
description = "Critical rules to prevent GHA vulnerabilities, enforce least-privilege, and secure third-party integrations."

  [[items.parameters]]
  name = "explicit least-privilege permissions"
  required = true
  type = "constraint"
  description = "All workflows must declare a global default permissions: {} (all scopes none) at top level, selectively enabling exact scopes on individual jobs."

  [[items.parameters]]
  name = "mandatory oidc federated identity"
  required = true
  type = "constraint"
  description = "Long-lived credentials inside GHA runner contexts are banned. Always authenticate securely using OIDC tokens via native configure-aws-credentials-like actions."

  [[items.parameters]]
  name = "pin actions by 40-character commit sha"
  required = true
  type = "constraint"
  description = "Mutable tag names or branches in uses: are banned. All actions must be pinned strictly to a 40-character commit SHA hash with tag commented, preceded by a link to the official releases page."

  [[items.parameters]]
  name = "strict namespace allowlist"
  required = true
  type = "constraint"
  description = "Third-party actions must belong strictly to the allowed list (actions/*, aquasecurity/*, aws-actions/*, dependabot/*, fossas/*, github/*, golang/*, golangci/*, google-github-actions/*, goreleaser/*, hashicorp/*, rancher-eio/*, renovatebot/*, and updatecli/*)."

  [[items.parameters]]
  name = "banned inline context interpolation"
  required = true
  type = "constraint"
  description = "Direct interpolation of untrusted fields (like PR titles, head refs) into templates in run: or github-script is banned. Pass through env: variables instead."

  [[items.parameters]]
  name = "banned pull_request_target trigger"
  required = true
  type = "constraint"
  description = "The pull_request_target trigger is strictly banned from all repository workflows. Use standard pull_request triggers instead."

[[items]]
name = "Reliability & Performance"
type = "Standard"
signature = "timeouts, concurrency, cache"
description = "Rules regarding timeouts, redundant run cancellation, and dependencies caching."

  [[items.parameters]]
  name = "mandatory job-level timeouts"
  required = true
  type = "constraint"
  description = "Every individual job MUST declare an explicit timeout-minutes value, never relying on defaults."

  [[items.parameters]]
  name = "redundant run cancellation"
  required = true
  type = "constraint"
  description = "PR workflows must implement a concurrency block to automatically cancel previous redundant pipeline runs for the same branch on a new push."

  [[items.parameters]]
  name = "cached runners dependency"
  required = true
  type = "constraint"
  description = "Speed up builds by implementing runner-level dependency caching via actions/cache or setup action config toggles."

[[items]]
name = "Structure & Maintainability"
type = "Standard"
signature = "orchestrate, scripts, steps"
description = "Declarative GHA orchestration, script isolation, descriptive names, and protected environments."

  [[items.parameters]]
  name = "declarative orchestration"
  required = true
  type = "constraint"
  description = "Workflows must orchestrate, not execute. Delegate code execution to external actions or isolated scripts."

  [[items.parameters]]
  name = "external script isolation"
  required = true
  type = "constraint"
  description = "Scripts longer than 5 lines must be moved into .github/workflows/scripts/ directory."

  [[items.parameters]]
  name = "external script validation"
  required = true
  type = "constraint"
  description = "All external scripts in .github/workflows/scripts must be validated/linted inside pull_request.yaml workflow."

  [[items.parameters]]
  name = "descriptive step naming"
  required = true
  type = "constraint"
  description = "Every workflow, job, and step MUST contain a descriptive name string."

  [[items.parameters]]
  name = "protected environments"
  required = true
  type = "constraint"
  description = "Any job utilizing production secrets or deploying to registries/environments must be gated behind manual approval environment blocks."
