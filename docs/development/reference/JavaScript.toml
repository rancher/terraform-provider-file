title = "JavaScript & Node.js Coding Standards"
description = "Strict reference index of JavaScript syntax, security, and integration rules for local tooling, agent scripts, enforcer hooks, and GHA workflows."
quadrant = "Reference"

[[items]]
name = "Syntax, Formatting & Linter Compliance"
type = "Standard"
signature = "errors, exports, actions"
description = "Rules regarding linter compliance, error swallowing, and GitHub action script signatures."

  [[items.parameters]]
  name = "no empty catch blocks"
  required = true
  type = "constraint"
  description = "Absolutely no empty catch blocks or discarded exceptions may exist in any JavaScript file. Exceptions must be explicitly logged or handled."

  [[items.parameters]]
  name = "gha export definition"
  required = true
  type = "constraint"
  description = "Every script run by actions/github-script MUST export an asynchronous default function receiving the action context object (e.g. export default async ({ github, context, core, process }) => { ... })."

  [[items.parameters]]
  name = "banned gha package imports"
  required = true
  type = "constraint"
  description = "Never manually import or require @actions/github or @actions/core inside GitHub Script runner files. Rely strictly on the injected function parameters."

[[items]]
name = "Robust Logic, State & Error Resilience"
type = "Standard"
signature = "json, octokit, REST"
description = "Rules for robust JSON parsing, REST endpoint preference, and explicit async-await in GHA scripts."

  [[items.parameters]]
  name = "fail-safe json parsing"
  required = true
  type = "constraint"
  description = "All JSON file reads and parsing routines must be wrapped in try-catch blocks, providing a fallback to a fresh default state if corrupt or malformed JSON is encountered."

  [[items.parameters]]
  name = "mandatory octokit pagination"
  required = true
  type = "constraint"
  description = "All GHA REST API calls that return arrays MUST use the github.paginate wrapper to guarantee exhaustive collection of paginated results."

  [[items.parameters]]
  name = "preferred rest over graphql"
  required = true
  type = "constraint"
  description = "Prefer github.rest.[endpoint] for standard operations. If GraphQL is structurally required, ensure the query is parameterized."

  [[items.parameters]]
  name = "mandatory async await"
  required = true
  type = "constraint"
  description = "All asynchronous API calls must be explicitly prefixed with await to prevent race conditions."

[[items]]
name = "Concurrency, Safety & Execution"
type = "Standard"
signature = "subprocess, git, SSH, webhooks"
description = "Vulnerability prevention, safe Git operations, correct SSH key signing, and sanitized payload handlers."

  [[items.parameters]]
  name = "safe subprocess execution"
  required = true
  type = "constraint"
  description = "All Git, GitHub CLI (gh), and system CLI executions inside local scripts and hooks MUST use execFileSync (or execFile) with positional argv arrays to prevent shell-injection."

  [[items.parameters]]
  name = "banned automatic destructive git"
  required = true
  type = "constraint"
  description = "Automation scripts and hooks are strictly forbidden from running destructive git commands (git reset --hard or git clean -fd) automatically without user confirmation."

  [[items.parameters]]
  name = "correct private key signing"
  required = true
  type = "constraint"
  description = "ssh-keygen -Y sign invocations in signing hooks, unit tests, and shell wrappers must always be passed the private key file path, never the public .pub path."

  [[items.parameters]]
  name = "sanitized gha payloads"
  required = true
  type = "constraint"
  description = "Treat all inputs from context.payload (PR titles, issue bodies, authors) as untrusted strings. Sanitize them before running regex matches or logging them."

  [[items.parameters]]
  name = "graceful api failures"
  required = true
  type = "constraint"
  description = "Wrap all GHA API operations in try-catch blocks, calling core.setFailed(error.message) on failure to gracefully exit."

[[items]]
name = "Automation Quality Gates, Testing & Architecture"
type = "Standard"
signature = "gates, logging, outputs"
description = "Requirements for gate artifact protection, immediate state revocation on failures, GHA native UI logging, and output bindings."

  [[items.parameters]]
  name = "gate artifact tamper protection"
  required = true
  type = "constraint"
  description = "Enforcer hooks must implement a strict denylist blocking edits, creation, or replacement of gating artifacts (*-approval.json, *.sig, *.challenge)."

  [[items.parameters]]
  name = "immediate state revocation"
  required = true
  type = "constraint"
  description = "If a validation step detects empty, missing, corrupt, or non-compliant outputs, the script must actively unlink or delete the active phase approval file and state flags."

  [[items.parameters]]
  name = "gha ui-native logging"
  required = true
  type = "constraint"
  description = "Avoid using raw console.log() inside GHA scripts. Use core.info(), core.notice(), core.warning(), or core.error() to ensure logs are natively parsed in the Actions UI."

  [[items.parameters]]
  name = "explicit output bindings"
  required = true
  type = "constraint"
  description = "Set workflow step outputs explicitly using core.setOutput('name', value) rather than relying on the function's implicit return value."

[[items]]
name = "Agentic Framework Security, Robustness & Integrity"
type = "Standard"
signature = "concurrency, paths, state, gates"
description = "Strict security, state machine, and error recovery standards for the Agentic Framework scripts and tools."

  [[items.parameters]]
  name = "strict path containment"
  required = true
  type = "constraint"
  description = "All file path lookups, custom reviews, or reducer matches must validate that the target path remains strictly within the workspace root. Use path.relative() and reject any paths that start with '..' or are absolute outside the root. Avoid using .startsWith(process.cwd()) as it is vulnerable to sibling path containment bypasses."

  [[items.parameters]]
  name = "fail-closed gate state"
  required = true
  type = "constraint"
  description = "All state, signature, and file writing operations (such as writeFileSafe) must fail closed. Callers must either explicitly check the boolean return values or write operations must throw errors on failure to prevent proceeding with corrupt or missing gate artifacts."

  [[items.parameters]]
  name = "robust process signal handlers"
  required = true
  type = "constraint"
  description = "All signal handlers (SIGINT, SIGTERM) must run complete cleanup/teardown hooks (e.g. releasing acquired file locks) before exiting the process to prevent stale locks."

  [[items.parameters]]
  name = "empty active ledger enforcement"
  required = true
  type = "constraint"
  description = "Gate 2 (Review Phase) validation must require an empty active findings ledger before signing the review-approval.json file, preventing approval of reports with active findings."

  [[items.parameters]]
  name = "directory review exclusions"
  required = true
  type = "constraint"
  description = "Recursive directory traversals for code reviews must explicitly exclude standard metadata, dependency, and build paths (.git, node_modules, bin, test) and binary/generated assets to prevent token bloat."

  [[items.parameters]]
  name = "safe github cli stdin parsing"
  required = true
  type = "constraint"
  description = "When sending comment bodies via the GitHub CLI API (gh api), use --input - to read from stdin. Avoid passing raw hyphen placeholders as literals to fields."

  [[items.parameters]]
  name = "unbroken promise chains in queues"
  required = true
  type = "constraint"
  description = "Ensure that queued asynchronous operations or mutex locks catch and handle promise rejections so that subsequent tasks in the chain are not permanently blocked."

  [[items.parameters]]
  name = "malformed output parse failures"
  required = true
  type = "constraint"
  description = "All parsers handling external API, agent, or file payloads must fail-hard on invalid/malformed JSON or text. They must never fall back to an empty result (e.g., returning an empty array on malformed auditor text) which would satisfy a quality gate as having 0 findings."

  [[items.parameters]]
  name = "concurrency-safe remediation batching"
  required = true
  type = "constraint"
  description = "Remediation scripts must implement bounded concurrent process pools to provide parallel execution throughput, rather than fully serializing batches with sleeps."

  [[items.parameters]]
  name = "no destructive task overwriting"
  required = true
  type = "constraint"
  description = "Avoid replacing task mappings or dictionaries in a way that overwrites previous findings for the same file. Always accumulate findings into a list."

  [[items.parameters]]
  name = "preservation of compatibility exports"
  required = true
  type = "constraint"
  description = "Do not remove legacy exported symbols from library APIs if they are imported by facades or other active tools, unless all importers are refactored together. Keep compatibility wrappers where necessary to prevent linking failures."

  [[items.parameters]]
  name = "robust phase state updates"
  required = true
  type = "constraint"
  description = "State updates must use the state library's setPhase to ensure phase-state.json and lock fields are correctly updated. Do not shadow library helpers with local functions that only write raw phase.txt files. TYPO or parsing errors must not destroy or delete the existing phase-state.json."

  [[items.parameters]]
  name = "module load side-effect guards"
  required = true
  type = "constraint"
  description = "All script entrypoints (especially hooks) must guard their main execution functions so they do not execute side-effects (such as reading stdin or calling process.exit) on module load. This ensures they can be safely imported and tested."

