title = "Go (Golang) Coding Standards"
description = "Strict reference index of Go syntax, security, concurrency, and architecture rules."
quadrant = "Reference"

[[items]]
name = "Syntax, Formatting & Linter Compliance"
type = "Standard"
signature = "golangci-lint, gofmt, goimports"
description = "Rules regarding linter compliance, syntax formatting, and banned package-level functions."

  [[items.parameters]]
  name = "golangci-lint"
  required = true
  type = "constraint"
  description = "All Go code must pass the local golangci-lint configuration with zero warnings or violations."

  [[items.parameters]]
  name = "no comment-out"
  required = true
  type = "constraint"
  description = "Commented-out code blocks must be deleted from active source files. Use Git history for retrieval."

  [[items.parameters]]
  name = "go formatting"
  required = true
  type = "constraint"
  description = "All files must be formatted with gofmt -s and imports must be grouped/ordered using goimports."

  [[items.parameters]]
  name = "no package init"
  required = true
  type = "constraint"
  description = "Package-level init() functions are strictly banned, except when registering drivers or immutable compiler guards."

[[items]]
name = "Error Handling & Logic Resilience"
type = "Standard"
signature = "errors"
description = "Rules regarding error checks, error wrapping, early returns, and panic/log.Fatal."

  [[items.parameters]]
  name = "check errors immediately"
  required = true
  type = "constraint"
  description = "Never ignore or discard return errors (using _ or omitting checks). Bad: local_func() Good: err := local_func(); if err != nil"

  [[items.parameters]]
  name = "sentinel wrapping"
  required = true
  type = "constraint"
  description = "Wrap bubbled errors using the %w verb to maintain the original call chain. Good: fmt.Errorf('... %w', err)"

  [[items.parameters]]
  name = "happy-path alignment"
  required = true
  type = "constraint"
  description = "Return immediately on error conditions to avoid deeply nested, hard-to-read conditional blocks."

  [[items.parameters]]
  name = "banned panic/log.Fatal"
  required = true
  type = "constraint"
  description = "Banned in all normal control flows and validation sequences, except for unrecoverable startup initialization failures."

[[items]]
name = "Concurrency, Safety & Execution"
type = "Standard"
signature = "concurrency"
description = "Vulnerability prevention, secure random gen, and context propagation."

  [[items.parameters]]
  name = "explicit context propagation"
  required = true
  type = "constraint"
  description = "The first parameter of any blocking, network, disk, or DB function MUST be ctx context.Context. Signature: func Method(ctx context.Context, id string) error"

  [[items.parameters]]
  name = "no struct-bound context"
  required = true
  type = "constraint"
  description = "Contexts must flow dynamically down the call stack. Do not store contexts inside structs or configurations."

  [[items.parameters]]
  name = "goroutine lifecycle cleanup"
  required = true
  type = "constraint"
  description = "Every goroutine launched (go func()) must be tracked using sync.WaitGroup, errgroup, or context cancellation to prevent leaks."

  [[items.parameters]]
  name = "channel closure safety"
  required = true
  type = "constraint"
  description = "Channels must only be closed by the sender goroutine. Writing to a closed channel is strictly forbidden."

  [[items.parameters]]
  name = "cryptographically secure random"
  required = true
  type = "constraint"
  description = "For GPG signing, tokens, challenges, and keys, you MUST use crypto/rand. math/rand is strictly banned."

  [[items.parameters]]
  name = "command injection mitigation"
  required = true
  type = "constraint"
  description = "Do not construct CLI arguments using string formatting or variable interpolation. Pass separate strings via argv arrays. Good: exec.CommandContext(ctx, 'git', 'diff', branch)"

[[items]]
name = "Architecture, State, Testing & Gates"
type = "Standard"
signature = "architecture"
description = "Rules regarding dependency injection, mutable package vars, naked returns, and testing."

  [[items.parameters]]
  name = "interface-driven DI"
  required = true
  type = "constraint"
  description = "Inject package dependencies as thin, descriptive interfaces (e.g., io.Writer) rather than concrete structs to support isolated mocking."

  [[items.parameters]]
  name = "no package-level mutable vars"
  required = true
  type = "constraint"
  description = "Global mutable package state is banned. Encapsulate state inside instantiated structs passed down via dependency injection."

  [[items.parameters]]
  name = "no naked returns in long functions"
  required = true
  type = "constraint"
  description = "Functions longer than 5 lines must explicitly name their return variables in the return statement."

  [[items.parameters]]
  name = "stand-alone integration test"
  required = true
  type = "constraint"
  description = "The ./test directory must contain its own independent Go module (test/go.mod) to separate testing dependencies."

  [[items.parameters]]
  name = "seeded local plugin cache"
  required = true
  type = "constraint"
  description = "Acceptance tests must use a localized Terraform plugin cache. The cache must be seeded offline from the global cache."
