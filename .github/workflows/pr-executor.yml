name: PR Executor and Auto-Merge

on:
  workflow_run:
    workflows: ["pull_request", "pull_request_review_trigger"]
    types:
      - completed
  workflow_dispatch:

permissions: {}

jobs:
  verify-and-merge:
    name: 'Verify and Auto-Merge PRs'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      checks: read
      copilot-requests: write
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Process Open PRs
        id: process-prs
        # https://github.com/actions/github-script/releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUTO_MERGE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const scriptPath = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/verify-pr-requirements.mjs`;
            const { default: script } = await import(scriptPath);
            await script({github, context, core, process});
