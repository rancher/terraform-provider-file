name: pull_request_review_trigger

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  trigger:
    name: 'Trigger Executor on Event'
    if: |
      github.event.issue.pull_request && (
        (startsWith(github.event.comment.body, '/merge') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (contains(github.event.comment.body, 'and generated no new comments.') && github.event.comment.user.login == 'github-actions[bot]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      issues: read
    steps:
      - name: Log Successful Trigger
        env:
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          EVENT_NAME: ${{ github.event_name }}
        run: .github/workflows/scripts/log-trigger.sh
