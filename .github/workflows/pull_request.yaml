name: pull_request

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_OWNER: ${{ github.repository_owner }}

permissions: {}

jobs:
  enforce-fork-contribution:
    name: 'Enforce Fork Contributions'
    runs-on: ubuntu-latest
    steps:
      - name: Check Contribution Origin
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
        run: |
          # Block anyone other than github-actions[bot] from using the release-please branch name
          if [[ "$HEAD_REF" == "release-please--branches--main" && "$ACTOR" != "github-actions[bot]" ]]; then
            echo "Error: Spoofing release-please branch is blocked. Only the system bot is allowed to use this branch." >&2
            exit 1
          fi

          # Block direct pushes to main from same-repository (except for release-please PR)
          if [[ "$HEAD_REPO" == "$BASE_REPO" && "$HEAD_REF" != "release-please--branches--main" ]]; then
            echo "Error: Contributions are required to come from forks. Directly pushing branches to the upstream repository is blocked." >&2
            exit 1
          fi

  terraform:
    name: 'Terraform'
    needs: enforce-fork-contribution
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Lint Terraform
        id: lint-terraform
        run: .github/workflows/scripts/nix-run.sh bash .github/workflows/scripts/lint.sh terraform

  actionlint:
    name: 'Lint Workflows'
    needs: enforce-fork-contribution
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Action Lint
        id: action-lint
        run: .github/workflows/scripts/nix-run.sh bash .github/workflows/scripts/lint.sh actionlint

  shellcheck:
    name: 'Shellcheck'
    needs: enforce-fork-contribution
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Shell Check
        id: shell-check
        run: .github/workflows/scripts/nix-run.sh bash .github/workflows/scripts/lint.sh shellcheck

  validate-commit-message:
    name: 'Validate Commit Message'
    needs: enforce-fork-contribution
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check commit message
        id: check-commit-message
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: .github/workflows/scripts/nix-run.sh bash .github/workflows/scripts/validate-commit-message.sh

  gitleaks:
    name: 'Scan for Secrets'
    needs: enforce-fork-contribution
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for secrets
        id: check-for-secrets
        run: .github/workflows/scripts/nix-run.sh bash .github/workflows/scripts/lint.sh gitleaks
        continue-on-error: true

  test-compile-check:
    name: 'Test Compile Check'
    needs: enforce-fork-contribution
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compile Check
        id: compile-check
        run: .github/workflows/scripts/nix-run.sh bash .github/workflows/scripts/test.sh compile

  lint-tests:
    name: 'Lint Tests'
    needs: enforce-fork-contribution
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compile Check
        id: compile-check
        run: .github/workflows/scripts/nix-run.sh bash .github/workflows/scripts/lint.sh tests

  unit-tests:
    name: 'Unit Tests'
    needs: enforce-fork-contribution
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run Unit Tests
        id: run-unit-tests
        run: .github/workflows/scripts/nix-run.sh bash .github/workflows/scripts/test.sh unit

  acceptance-tests:
    name: 'Acceptance Tests (No Relay)'
    needs: enforce-fork-contribution
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/nix:20260603-18
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        id: checkout-repository
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run Acceptance Tests
        id: run-acc-tests
        run: .github/workflows/scripts/nix-run.sh bash .github/workflows/scripts/test.sh acc
